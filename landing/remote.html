<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#111214" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://esm.sh; connect-src https: wss:; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
<link rel="icon" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>riven 원격 제어</title>
<style>
  :root {
    --bg: #111214; --bg2: #1a1b1f; --bg3: #23252b; --edge: #2e3038;
    --fg: #e8e8ea; --dim: #8b8d96; --accent: #8b7cf6; --ok: #3fb950; --warn: #e3b341; --bad: #f85149;
    --r: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--edge); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .conn.on .dot { background: var(--ok); }
  .conn.off .dot { background: var(--bad); }
  main { padding: 12px 16px; display: flex; flex-direction: column; gap: 18px; }
  .sec h2 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
  .card { background: var(--bg2); border: 1px solid var(--edge); border-radius: var(--r); padding: 12px 14px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .agent { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; color: inherit; font: inherit;
    background: var(--bg2); border: 1px solid var(--edge); border-radius: var(--r); padding: 12px 14px; }
  .agent[disabled] { opacity: .75; }
  .agent .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .k { font-size: 12px; color: var(--dim); flex: none; }
  .st { font-size: 12px; white-space: nowrap; flex: none; padding: 2px 8px; border-radius: 999px; background: var(--bg3); color: var(--dim); }
  .st.busy { color: var(--accent); }
  .st.waiting { color: var(--warn); }
  .st.done { color: var(--ok); }
  .ask .q { margin: 0 0 10px; white-space: pre-wrap; }
  .ask .who { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  button.opt, button.btn { font: inherit; color: var(--fg); background: var(--bg3); border: 1px solid var(--edge);
    border-radius: 10px; padding: 9px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--dim); font-size: 14px; padding: 6px 2px; }
  .sheet { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / .55); display: none; align-items: flex-end; }
  .sheet.open { display: flex; }
  .sheet .panel { width: 100%; max-height: 88vh; display: flex; flex-direction: column; gap: 10px; background: var(--bg2);
    border-top-left-radius: 18px; border-top-right-radius: 18px; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); }
  .sheet .head { display: flex; align-items: center; gap: 10px; }
  .sheet .head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
  .bubble { padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .bubble.me { align-self: flex-end; background: color-mix(in srgb, var(--accent) 30%, var(--bg3)); max-width: 85%; }
  .bubble.it { align-self: stretch; background: var(--bg3); }
  .bubble.wait { color: var(--dim); }
  textarea { width: 100%; min-height: 84px; resize: vertical; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 20;
    background: var(--bg3); border: 1px solid var(--edge); border-radius: var(--r); padding: 12px 14px;
    box-shadow: 0 10px 30px rgb(0 0 0 / .5); display: none; }
  .toast.show { display: block; }
  .unpaired { text-align: center; color: var(--dim); padding: 40px 12px; line-height: 1.7; }
  footer { padding: 4px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  footer small { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>riven</h1>
  <span id="conn" class="conn"><span class="dot"></span><span id="connText">연결 중…</span></span>
</header>
<main id="main"></main>
<footer id="foot" hidden>
  <small>종단간 암호화됨</small>
  <button class="btn" id="unpair">이 기기 연결 해제</button>
</footer>

<div id="sheet" class="sheet">
  <div class="panel">
    <div class="head"><b id="sheetTitle"></b><button class="btn" id="sheetClose">닫기</button></div>
    <div id="log" class="log"></div>
    <textarea id="text" placeholder="에이전트에게 보낼 메시지"></textarea>
    <div class="row"><button class="btn primary" id="sendBtn">보내기</button></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
// riven remote control, the phone side. Pairs with renderer state/remote.ts.
//
// Envelope (must match src/renderer/src/lib/remoteCrypto.ts): AES-256-GCM with
// the pairing key, a 12-byte IV, the channel id as associated data, both
// base64url; the plaintext is JSON with `ts` (ms) and a random `n` added, and
// `from` ('phone' | 'desk'). Messages are broadcast on the Realtime channel
// `riven-remote-<channel>` as event 'm'.
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const STORE = 'riven-remote-pairing'
const WINDOW_MS = 3 * 60_000
const enc = new TextEncoder()
const dec = new TextDecoder()
const $ = (id) => document.getElementById(id)

const toB64u = (b) => { let s = ''; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') }
const fromB64u = (s) => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); const o = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o }
const rand = (n) => crypto.getRandomValues(new Uint8Array(n))

// ---- pairing: taken from the URL fragment once, then kept on this phone ----
function readPairing() {
  const h = new URLSearchParams(location.hash.slice(1))
  if (h.get('c') && h.get('k') && h.get('u') && h.get('a')) {
    const p = { c: h.get('c'), k: h.get('k'), u: h.get('u'), a: h.get('a') }
    localStorage.setItem(STORE, JSON.stringify(p))
    // Out of the address bar and the history: it is a key.
    history.replaceState(null, '', location.pathname)
    return p
  }
  try { return JSON.parse(localStorage.getItem(STORE) || 'null') } catch { return null }
}

const pairing = readPairing()
const main = $('main')

if (!pairing) {
  $('conn').hidden = true
  main.innerHTML = '<div class="unpaired">연결된 컴퓨터가 없어요.<br>riven의 <b>설정 › 원격 제어</b>에서<br>QR 코드를 휴대폰 카메라로 찍어주세요.</div>'
} else {
  start(pairing)
}

async function start(p) {
  $('foot').hidden = false
  $('unpair').onclick = () => {
    if (!confirm('이 휴대폰의 연결 정보를 지울까요? 다시 쓰려면 QR을 새로 찍어야 해요.')) return
    localStorage.removeItem(STORE)
    location.reload()
  }

  const key = await crypto.subtle.importKey('raw', fromB64u(p.k), 'AES-GCM', false, ['encrypt', 'decrypt'])
  const seal = async (msg) => {
    const iv = rand(12)
    const body = enc.encode(JSON.stringify({ ...msg, from: 'phone', ts: Date.now(), n: toB64u(rand(9)) }))
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(p.c) }, key, body)
    return { iv: toB64u(iv), ct: toB64u(new Uint8Array(ct)) }
  }
  const open = async (env) => {
    if (!env || typeof env.iv !== 'string' || typeof env.ct !== 'string') return null
    try {
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64u(env.iv), additionalData: enc.encode(p.c) }, key, fromB64u(env.ct))
      return JSON.parse(dec.decode(pt))
    } catch { return null }
  }
  const seen = new Map()
  const fresh = (m) => {
    if (typeof m.ts !== 'number' || typeof m.n !== 'string' || Math.abs(Date.now() - m.ts) > WINDOW_MS || seen.has(m.n)) return false
    seen.set(m.n, m.ts)
    if (seen.size > 500) for (const [k, t] of seen) if (Date.now() - t > WINDOW_MS) seen.delete(k)
    return true
  }

  // ---- state ----
  let agents = []
  const asks = new Map()
  const logs = new Map() // chatKey -> [{who, text, reqId?}]
  let current = null // chatKey of the open sheet
  let deskOnline = false

  const supabase = createClient(p.u, p.a, { auth: { persistSession: false, autoRefreshToken: false } })
  const ch = supabase.channel('riven-remote-' + p.c, {
    config: { broadcast: { self: false }, presence: { key: 'phone-' + toB64u(rand(6)) } }
  })
  const send = async (msg) => ch.send({ type: 'broadcast', event: 'm', payload: await seal(msg) })

  ch.on('broadcast', { event: 'm' }, async ({ payload }) => {
    const m = await open(payload)
    if (!m || m.from !== 'desk' || !fresh(m)) return
    receive(m)
  })
  ch.on('presence', { event: 'sync' }, () => {
    deskOnline = Object.keys(ch.presenceState()).includes('desk')
    setConn()
  })
  ch.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') {
      await ch.track({ role: 'phone' })
      send({ t: 'hello' })
    }
    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setConn('중계 서버 연결 실패, 재시도 중')
  })
  // Back from the background: ask for the current picture again.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) send({ t: 'hello' }) })

  function setConn(text) {
    const c = $('conn')
    c.className = 'conn ' + (deskOnline ? 'on' : 'off')
    $('connText').textContent = text || (deskOnline ? '컴퓨터 연결됨' : '컴퓨터 응답 없음')
  }

  function receive(m) {
    switch (m.t) {
      case 'roster': agents = Array.isArray(m.agents) ? m.agents : []; render(); break
      case 'ask': asks.set(m.id, m); render(); notify('질문이 도착했어요', (m.title ? m.title + ': ' : '') + m.question); break
      case 'askGone': asks.delete(m.id); render(); break
      case 'ack':
        if (!m.ok) markReply(m.reqId, '보내지 못했어요: 이 패널이 컴퓨터에서 열려 있지 않아요.')
        break
      case 'reply': markReply(m.reqId, m.text, m.chatKey); break
      case 'event':
        notify(m.kind === 'done' ? '작업 완료' : '확인이 필요해요', m.title)
        break
    }
  }

  function markReply(reqId, text, chatKey) {
    for (const [key, list] of logs) {
      const i = list.findIndex((x) => x.reqId === reqId && x.who === 'wait')
      if (i >= 0) { list[i] = { who: 'it', text }; chatKey = key; break }
    }
    if (chatKey === current) renderLog()
    const a = agents.find((x) => x.id === chatKey)
    if (a) notify('답변 도착', a.title)
  }

  // ---- notifications: only while this page is open (phase 1) ----
  let toastTimer = 0
  function notify(title, body) {
    const t = $('toast')
    t.textContent = title + (body ? ' · ' + body : '')
    t.classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => t.classList.remove('show'), 4000)
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body }) } catch {}
    }
  }

  // ---- rendering (textContent only: nothing from the wire becomes HTML) ----
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
  const STATUS = { busy: '실행 중', waiting: '확인 필요', done: '완료', idle: '대기' }

  function render() {
    main.replaceChildren()
    if (asks.size) {
      const sec = el('section', 'sec'); sec.append(el('h2', null, '질문'))
      const list = el('div', 'list')
      for (const a of asks.values()) {
        const card = el('div', 'card ask')
        if (a.title) card.append(el('div', 'who', a.title))
        card.append(el('p', 'q', a.question))
        const opts = el('div', 'opts')
        for (const o of a.options || []) {
          const b = el('button', 'opt', o)
          b.onclick = () => { send({ t: 'answer', id: a.id, choice: o }); asks.delete(a.id); render() }
          opts.append(b)
        }
        card.append(opts)
        list.append(card)
      }
      sec.append(list); main.append(sec)
    }
    const byWs = new Map()
    for (const a of agents) { if (!byWs.has(a.workspace)) byWs.set(a.workspace, []); byWs.get(a.workspace).push(a) }
    if (!byWs.size) main.append(el('div', 'empty', deskOnline ? '열려 있는 에이전트가 없어요.' : '컴퓨터의 riven이 꺼져 있거나 잠들어 있어요.'))
    for (const [ws, list] of byWs) {
      const sec = el('section', 'sec'); sec.append(el('h2', null, ws))
      const box = el('div', 'list')
      for (const a of list) {
        const b = el('button', 'agent')
        b.append(el('span', 't', a.title))
        b.append(el('span', 'k', a.kind === 'chat' ? '챗' : '터미널'))
        b.append(el('span', 'st ' + a.status, STATUS[a.status] || a.status))
        if (a.canSend) b.onclick = () => openSheet(a)
        else b.disabled = true
        box.append(b)
      }
      sec.append(box); main.append(sec)
    }
  }

  function openSheet(a) {
    current = a.id
    $('sheetTitle').textContent = a.title
    $('sheet').classList.add('open')
    renderLog()
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {})
  }
  function renderLog() {
    const log = $('log'); log.replaceChildren()
    const list = logs.get(current) || []
    if (!list.length) log.append(el('div', 'empty', '보낸 메시지와 답변이 여기 보여요.'))
    for (const x of list) log.append(el('div', 'bubble ' + (x.who === 'me' ? 'me' : x.who === 'wait' ? 'it wait' : 'it'), x.who === 'wait' ? '답변을 기다리는 중…' : x.text))
    log.scrollTop = log.scrollHeight
  }
  $('sheetClose').onclick = () => { $('sheet').classList.remove('open'); current = null }
  $('sendBtn').onclick = () => {
    const text = $('text').value.trim()
    if (!text || !current) return
    const reqId = toB64u(rand(9))
    const list = logs.get(current) || []
    list.push({ who: 'me', text }, { who: 'wait', reqId })
    logs.set(current, list.slice(-40))
    $('text').value = ''
    renderLog()
    send({ t: 'send', reqId, chatKey: current, text })
  }

  setConn('연결 중…')
  render()
}
</script>
</body>
</html>
