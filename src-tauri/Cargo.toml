[package]
name = "riven-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "devtools", "macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "process", "io-util", "net", "macros"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
regex = "1"
sha1 = "0.10"
base64 = "0.22"
portable-pty = "0.9"
libc = "0.2"
# DB (services/db): the PostgreSQL and MySQL wire protocols are spoken here
# (text results, like node-pg / mysql2); SQLite is the bundled C library.
postgres-protocol = "0.6"
bytes = "1"
libsqlite3-sys = { version = "0.40", features = ["bundled"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha1"] }
aes-gcm = "0.10"
ryu-js = "1"
encoding_rs = "0.8"
flate2 = "1"
crc32fast = "1"
# Updates (services/update.rs). native-tls: the TLS stack already in the tree.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }

# Already in the tree through wry; same versions, a few more features.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSError", "NSJSONSerialization", "NSNotification", "NSOperation", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSScreen", "NSWorkspace"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationDelegate", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKUserScript", "WKWebViewConfiguration", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNError", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
