name: Release

# Push a version tag (e.g. v1.0.1) → the Windows Electron build, plus the Mac
# assets carried over from the newest Tauri release (see release-mac).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create/update the GitHub Release

jobs:
  # The Mac app is the Tauri build now (release-tauri.yml, tauri-v* tags). A
  # v* release still becomes "latest", and Macs still on Electron read
  # latest-mac.yml from "latest": carry the newest published Tauri release's
  # Electron-feed assets so they keep moving to Tauri, never back to Electron.
  release-mac:
    runs-on: ubuntu-latest
    steps:
      - name: Carry the Tauri Mac assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '[.[].tagName | select(startswith("tauri-v"))][0]')
          [ -n "$T" ] || { echo "::error::no published tauri-v release to carry"; exit 1; }
          echo "carrying Mac assets from $T"
          mkdir -p release
          gh release download "$T" --repo "$GITHUB_REPOSITORY" --dir release --pattern 'latest-mac.yml' --pattern '*-mac.zip'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*-mac.zip
            release/latest-mac.yml
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Windows build (NSIS installer). Unsigned for now — no Windows code-signing
  # cert is configured, so SmartScreen will warn on first run until one is added
  # (set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets + reference them here).
  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs electron-rebuild for node-pty against the Electron ABI.
      - name: Install dependencies
        run: npm ci

      - name: Configure Supabase env
        shell: bash
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "VITE_SUPABASE_REDIRECT=${{ secrets.VITE_SUPABASE_REDIRECT }}"
          } > .env

      - name: Build (NSIS installer)
        run: npm run dist:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
